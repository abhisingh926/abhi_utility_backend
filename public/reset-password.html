<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset your Abhi Utility password</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <main class="card">
    <h1>Reset your password</h1>

    <!-- Step 1: ask for a code -->
    <form id="request-form">
      <p class="muted">Enter your account email. We'll send you a 6-digit code.</p>
      <label>Email <input type="email" name="email" autocomplete="username" required></label>
      <button type="submit" class="primary">Send code</button>
    </form>

    <!-- Step 2: code + new password -->
    <form id="reset-form" class="hidden">
      <p class="muted" id="sent-to"></p>
      <label>Code from the email <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
      <label>New password (at least 8 characters) <input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repeat new password <input type="password" name="password2" autocomplete="new-password" minlength="8" required></label>
      <button type="submit" class="primary">Set new password</button>
      <button type="button" id="resend" class="link">Send a new code</button>
    </form>

    <p id="message" class="message"></p>
  </main>
  <script src="/static/reset-password.js"></script>
</body>
</html>
